name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2
      - name: Enable user namespaces for nested Nix protocol fixtures
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Evaluate public flake outputs
        run: nix flake check --no-build --option allow-import-from-derivation false
      - name: Build package and run Hegel/native checks
        run: >-
          nix build --no-link --print-build-logs
          .#default
          .#checks.x86_64-linux.core
          .#checks.x86_64-linux.native
          .#checks.x86_64-linux.native-development
          .#checks.x86_64-linux.configuration
      - name: Verify development shell
        run: nix develop --command nix build-log --help
